name: Windows soundboard

# Builds and tests AudioMixerSoundboard.exe. Releases are published by release.yml, which calls this.
on:
  push:
    paths: ["windows/**", "amx_sounds.py", "tests/**", ".github/workflows/windows.yml"]
  pull_request:
    paths: ["windows/**", "amx_sounds.py", "tests/**", ".github/workflows/windows.yml"]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r windows/requirements.txt pyinstaller==6.14.1

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Self-test from source
        run: |
          $env:AMXSB_HOME = "$env:RUNNER_TEMP\amxsb"
          python windows/main.py --selftest
          if ($LASTEXITCODE -ne 0) { throw "self-test failed" }

      - name: Build the .exe
        run: >
          pyinstaller --noconfirm --onefile --windowed --name AudioMixerSoundboard
          --icon windows/icon.ico
          --add-data "windows/ui;ui" --add-data "windows/icon.ico;."
          --hidden-import pystray._win32
          --paths windows --paths .
          --hidden-import pynput.keyboard._win32 --hidden-import pynput.mouse._win32
          windows/main.py

      - name: Self-test the .exe
        run: |
          $env:AMXSB_HOME = "$env:RUNNER_TEMP\amxsb-exe"
          $p = Start-Process -FilePath dist\AudioMixerSoundboard.exe -ArgumentList "--selftest" -Wait -PassThru
          Get-Content "$env:AMXSB_HOME\log.txt"
          if ($p.ExitCode -ne 0) { throw "self-test failed with exit code $($p.ExitCode)" }
          if (-not (Select-String -Path "$env:AMXSB_HOME\log.txt" -Pattern "SELFTEST OK" -Quiet)) { throw "no SELFTEST OK" }

      - uses: actions/upload-artifact@v4
        with:
          name: AudioMixerSoundboard-windows
          path: dist/AudioMixerSoundboard.exe
