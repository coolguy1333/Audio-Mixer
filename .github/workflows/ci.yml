name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 gcc
          pipx install ruff
      - name: Lint (errors only)
        run: ruff check --select F,E9,PLE --line-length 200 .
      - name: Byte-compile
        run: python3 -m py_compile audio_mixer.py amx_effects.py amx_extras.py amx_sounds.py
      - name: Build the effects plugin
        run: gcc -O2 -Wall -fPIC -shared -o fx/amx_fx.so fx/amx_fx.c -DAMX_NO_RNNOISE -lm
      - name: Unit tests
        run: /usr/bin/python3 -m unittest discover -s tests -v
